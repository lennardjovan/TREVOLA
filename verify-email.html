<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email | Trevola</title>
    <meta name="description" content="Verify your email address to activate your Trevola account.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper" style="padding-top:60px;">
        <div class="auth-card-airbnb">
            <h1 style="font-size:1.4rem; margin-bottom:8px;">Verify your email</h1>
            <p style="font-size:0.9rem; color:#6b6b6b; margin-bottom:20px;">
                We've sent a 6-digit code to your email address. Enter it below to activate your account.
            </p>

            <form id="verifyForm">
                <div class="input-group">
                    <label for="codeInput">Verification Code</label>
                    <input type="text" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                        placeholder="123456" autocomplete="one-time-code" required>
                </div>
                <button type="submit" class="btn-neon full-width">Verify Email</button>
            </form>

            <p id="verifyMessage" class="auth-msg" aria-live="polite"></p>

            <button type="button" id="resendBtn" class="btn-outline full-width" style="margin-top:12px;">
                Resend Code
            </button>

            <div class="back-navigation" style="margin-top:20px; text-align:center;">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- EmailJS SDK, needed to resend a verification email from this page -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="verify-email.js"></script>
    <script src="cookie-consent.js"></script>
</body>

</html>
