<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Trevola</title>
    <meta name="description" content="Reset your Trevola account password.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="auth-wrapper" style="padding-top:60px;">
        <div class="auth-card-airbnb">

            <div id="requestStep">
                <h2>Forgot your password?</h2>
                <p style="font-size:0.9rem; color:#6b6b6b; margin:10px 0 20px;">
                    Enter your username and we'll email a reset code to the address on your account.
                </p>
                <form id="requestForm">
                    <div class="input-group">
                        <label for="usernameInput">Username</label>
                        <input type="text" id="usernameInput" required>
                    </div>
                    <button type="submit" class="btn-neon full-width">Send Reset Code</button>
                    <p id="requestMessage" class="auth-msg" aria-live="polite"></p>
                </form>
            </div>

            <div id="resetStep" style="display:none;">
                <h2>Enter your new password</h2>
                <p style="font-size:0.9rem; color:#6b6b6b; margin:10px 0 20px;">
                    Check your email for a 6-digit code.
                </p>
                <form id="resetForm">
                    <div class="input-group">
                        <label for="codeInput">Reset Code</label>
                        <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456" required>
                    </div>
                    <div class="input-group">
                        <label for="newPasswordInput">New Password</label>
                        <input type="password" id="newPasswordInput" required minlength="8">
                    </div>
                    <div class="input-group">
                        <label for="confirmPasswordInput">Confirm New Password</label>
                        <input type="password" id="confirmPasswordInput" required minlength="8">
                    </div>
                    <button type="submit" class="btn-neon full-width">Reset Password</button>
                    <button type="button" id="resendResetBtn" class="btn-outline full-width" style="margin-top:10px;">Resend Code</button>
                    <p id="resetMessage" class="auth-msg" aria-live="polite"></p>
                </form>
            </div>

            <div class="back-navigation" style="margin-top:20px; text-align:center;">
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="module" src="forgot-password.js"></script>
    <script src="cookie-consent.js"></script>
</body>

</html>
