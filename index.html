<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trevola | Your Stay. Your Way.</title>
    <meta name="description" content="Book unique stays for business, work, or leisure on Trevola — the modern property booking platform.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- Navigation Header -->
        <header class="main-header">
            <div class="logo">TRE<span>VOLA</span></div>
            <div class="header-tagline">YOUR STAY. YOUR WAY.</div>
            <button type="button" id="openAuthModalBtn" class="btn-outline">Log In / Sign Up</button>
        </header>

        <!-- Hero Section -->
        <section class="hero-section">
            <span class="hero-badge">THE 2026 BOOKING STANDARD</span>
            <h1 class="hero-title">Your Stay.<br><span>Your Way.</span></h1>

            <!-- Category Filter Pills -->
            <div class="category-filters">
                <button class="category-btn active" data-category="all">ALL STAYS</button>
                <button class="category-btn" data-category="professional">PROFESSIONAL</button>
                <button class="category-btn" data-category="working_class">WORKING CLASS</button>
                <button class="category-btn" data-category="tourist">TOURIST</button>
            </div>

            <!-- Search Bar -->
            <div class="search-bar">
                <div class="search-item">
                    <label for="searchInput">SEARCH A PROPERTY</label>
                    <input type="text" id="searchInput" placeholder="Search title, city">
                </div>
                <div class="search-item">
                    <label for="maxPriceInput">MAX PRICE ($/night)</label>
                    <input type="text" id="maxPriceInput" placeholder="e.g. 200" min="0">
                </div>
                <button id="searchBtn" type="button" class="btn-neon search-btn">SEARCH</button>
            </div>
        </section>

        <!-- Airbnb-Style Tabbed Auth Modal -->
        <div id="authModalOverlay" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <button type="button" id="closeAuthModalBtn" class="modal-close" aria-label="Close">&times;</button>

                <div class="auth-card">

                    <!-- Tab Switcher -->
                    <div class="auth-tabs">
                        <button type="button" class="tab-btn active" id="userTabBtn" onclick="switchAuthTab('user')">User
                            Login</button>
                        <button type="button" class="tab-btn" id="hostTabBtn" onclick="switchAuthTab('host')">Host
                            Login</button>
                    </div>

                    <!-- User Form -->
                    <form id="userform" class="auth-form active">
                        <div class="input-group">
                            <label for="userUsername">Username</label>
                            <input type="text" id="userUsername" placeholder="Enter your username" autocomplete="off"
                                required>
                        </div>
                        <div class="input-group">
                            <label for="userPassword">Password</label>
                            <input type="password" id="userPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-neon full-width">Login as User</button>
                        <button type="button" id="registerBtn" class="btn-outline full-width">Create Account</button>
                        <p style="text-align:center; margin-top:10px;"><a href="forgot-password.html" style="font-size:0.85rem;">Forgot password?</a></p>
                        <p id="userLoginMessage" class="auth-msg" aria-live="polite"></p>
                    </form>

                    <!-- Host Form -->
                    <form id="hostform" class="auth-form" style="display: none;">
                        <div class="input-group">
                            <label for="hostUsername">Username</label>
                            <input type="text" id="hostUsername" placeholder="Enter host username" autocomplete="off"
                                required>
                        </div>
                        <div class="input-group">
                            <label for="hostPassword">Password</label>
                            <input type="password" id="hostPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-neon full-width">Login as Host</button>
                        <button type="button" id="hostRegisterBtn" class="btn-outline full-width">Register as Host</button>
                        <p style="text-align:center; margin-top:10px;"><a href="forgot-password.html" style="font-size:0.85rem;">Forgot password?</a></p>
                        <p id="hostLoginMessage" class="auth-msg" aria-live="polite"></p>
                    </form>

                </div>
            </div>
        </div>

        <!-- Listings Section -->
        <main class="listings-section">
            <h2 class="section-heading">Featured Stays</h2>
            <div id="listingsContainer">
                <div class="no-listings">
                    <p>No listings found in this category.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="file.js"></script>
    <script type="module" src="all_listings.js"></script>
    <script src="auth-modal.js"></script>

        <footer class="legal-footer">
        <a href="terms.html">Terms of Service</a> |
        <a href="privacy.html">Privacy Policy</a>
    </footer>
    <script src="cookie-consent.js"></script>
</body>

</html>
